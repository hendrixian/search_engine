services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    networks:
      - docker_academic-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - docker_academic-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - docker_academic-net

  search-api:
    build: 
      context: ../
      dockerfile: Docker/Dockerfile
    container_name: academic-search-api
    ports:
      - "5000:5000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./model_cache:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      - FLASK_APP=flask_app.py
      - FLASK_ENV=production
      - ELASTICSEARCH_HOST=http://elasticsearch:9200  # Fixed: Added http://
      - MINIO_ENDPOINT=minio:9000
      - REDIS_URL=redis://redis:6379
    # FIXED: Reduced workers and increased timeout
    command: gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 4 --timeout 120 --preload wsgi:app
    networks:
      - docker_academic-net
    restart: unless-stopped
    # FIXED: Add memory limits
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  search-ui:
    build:
      context: ../
      dockerfile: Docker/Dockerfile
    container_name: academic-search-ui
    ports:
      - "8080:8080"
    volumes:
      - ../../templates:/app/templates:ro
      - ../../static:/app/static:ro
    environment:
      - API_BASE_URL=http://search-api:5000
      - FLASK_ENV=development
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    command: >
      sh -c "cd /app &&
      gunicorn --bind 0.0.0.0:8080 --workers 1 flask_app:app"
    depends_on:
      - search-api
    networks:
      - docker_academic-net


  monitor:
    build: 
      context: ../
      dockerfile: Docker/Dockerfile
    container_name: academic-search-monitor
    ports:
      - "5001:5001"
    env_file:
      - .env  # Add this line - monitor was missing env_file
    environment:
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}  # Add this line
      - FLASK_APP=monitor/dashboard.py
      - FLASK_ENV=production
      - REDIS_URL=redis://redis:6379
    command: >
      sh -c "cd /app &&
      gunicorn --bind 0.0.0.0:5001 --workers 1 --timeout 120 monitor.dashboard:app"
    volumes:
      - ./model_cache:/root/.cache/huggingface
    depends_on:
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - docker_academic-net
    restart: unless-stopped

volumes:
  minio-data:

networks:
  docker_academic-net:
    driver: bridge